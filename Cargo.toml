[package]
name = "bedrock-services"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Native account authentication and services for Minecraft Bedrock clients"
repository = "https://github.com/cinnabar-mc/bedrock-services"
publish = false

[features]
test-support = ["rta-tokio", "signaling-tokio", "tokio/rt", "tokio/macros", "tokio/sync", "tokio-websockets/server"]
signaling-tokio = ["dep:tokio-websockets", "dep:futures-util", "dep:tokio-rustls", "dep:webpki-roots"]
rta-tokio = ["dep:tokio-websockets", "dep:futures-util", "dep:tokio-rustls", "dep:webpki-roots", "dep:httparse", "dep:aws-lc-rs"]

[dependencies]
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"], optional = true }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"], optional = true }
httparse = { version = "1", optional = true }
httpdate = "1"
hyper = { version = "1", default-features = false }
ipnet = "2"
p256 = { version = "0.14", default-features = false, features = ["std", "ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["std", "ecdsa", "pkcs8"] }
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["net", "time", "io-util", "rt"] }
tokio-websockets = { version = "0.13", default-features = false, features = ["client", "rustls-bring-your-own-connector", "aws_lc_rs", "getrandom"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"], optional = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
webpki-roots = { version = "1", optional = true }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
h2 = "0.4"
http = "1"
tokio-websockets = { version = "0.13", default-features = false, features = ["server", "aws_lc_rs"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"

[[example]]
name = "messaging"
required-features = ["signaling-tokio"]
