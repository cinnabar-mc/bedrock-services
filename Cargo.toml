[package]
name = "bedrock-services"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Native account authentication and services for Minecraft Bedrock clients"
repository = "https://github.com/cinnabar-mc/bedrock-services"
publish = false

[dependencies]
base64 = "0.22"
httpdate = "1"
ipnet = "2"
p256 = { version = "0.14", default-features = false, features = ["std", "ecdsa"] }
percent-encoding = "2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
perf = "warn"
