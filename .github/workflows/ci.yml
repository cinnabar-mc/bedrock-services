name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/go-oracle/go.mod
          cache-dependency-path: tools/go-oracle/go.sum
      - working-directory: tools/go-oracle
        run: go build -o ../../target/go-signature-oracle.exe .
      - run: cargo fmt --all --check
      - run: cargo check --lib --no-default-features --locked
      - run: cargo test --all-targets --all-features --locked
        env:
          BEDROCK_SERVICES_GO_ORACLE: ${{ github.workspace }}/target/go-signature-oracle.exe
      - run: cargo test --doc --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: minimum-rust
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source, open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + tomllib.load(source)['package']['rust-version'], file=output)
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.minimum-rust.outputs.version }}
      - run: cargo check --all-targets --all-features --locked
